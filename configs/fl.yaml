# Flower simulation: one client per signer. PLAN.md sections 6 and 7.

simulation:
  backend: ray
  num_clients: 10           # LSA64 has 10 signers; held-out signers are excluded per fold
  client_resources:
    num_cpus: 1
    num_gpus: 0             # MPS is not shareable across ray workers; clients run on CPU
  ray_init_args:
    include_dashboard: false
  client_device: cpu        # clients live in ray actors; see simulation.client_resources

server:
  num_rounds: 50
  fraction_fit: 1.0         # 7-9 training clients: sample all of them every round
  # 0.0 on purpose: a client can only evaluate on its own partition, which is the data it
  # just trained on, so distributed evaluation measures local fit rather than generalization.
  # The number that matters is server-side and centralized -- the global model on the
  # held-out validation signer -- and that runs every round regardless of this setting.
  fraction_evaluate: 0.0
  min_fit_clients: 2
  min_available_clients: 2

client:
  local_epochs: 2
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.01

strategy:
  name: fedper             # fedavg | fedper
  # fedper aggregates only parameters whose name starts with one of these prefixes.
  # Everything else stays on the client and is never transmitted
  # (asserted in tests/test_fedper.py).
  aggregate_prefixes: ["encoder."]
  private_prefixes: ["head."]

personalization:
  # PLAN.md section 6 sweeps k to 20. LSA64 records exactly 5 repetitions of every sign by
  # every signer, and one is reserved as a fixed query set, so k > 4 cannot be drawn at all
  # -- signadapt.data.dataset.kshot_indices raises rather than silently truncating. The
  # sweep below is the realizable one; feasible_k_values() re-derives it from the data, so
  # a larger dataset can restore the original values without editing code.
  k_values: [0, 1, 2, 3, 4]
  query_repetitions: 1
  seeds: [0, 1, 2]
  adapt_epochs: 30
  adapt_lr: 1.0e-3         # E5/E6: a head starting from scratch
  # E4 fine-tunes the whole pretrained encoder. At the head's rate that encoder is simply
  # destroyed, and reporting E4 under a rate that wrecks it would rig the comparison against
  # the baseline the proposed method has to beat. This is the rate it was pretrained at.
  adapt_lr_full: 3.0e-4
  loso: true               # leave-one-signer-out over every signer

checks:
  # PLAN.md section 8 week 4: FedAvg on an IID split must land near centralized training,
  # otherwise a broken FL loop is indistinguishable from a negative research result.
  iid_tolerance: 0.03      # absolute top-1 difference vs centralized
